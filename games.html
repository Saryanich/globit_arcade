<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GloBIT Arcade • Игры</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/wFK0H7rM/Glo-BIT-Arcade.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/wFK0H7rM/Glo-BIT-Arcade.jpg">
    <link rel="apple-touch-icon" sizes="152x152" href="https://i.ibb.co/wFK0H7rM/Glo-BIT-Arcade.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/wFK0H7rM/Glo-BIT-Arcade.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GloBIT Arcade">
    <meta name="theme-color" content="#0a2e1a">

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <style>
        :root {
            --accent-green: #00e676;
            --accent-blue: #2979ff;
            --accent-red: #ff1744;
            --text-secondary: #8899bb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #0a2e1a 0%, #0a1a2e 40%, #1a0a2e 80%, #0d1a30 100%);
            min-height: 100vh;
            color: #ffffff;
            position: relative;
        }

        #particles-js {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }

        .app {
            position: relative; z-index: 10; max-width: 1000px; margin: 0 auto; padding: 1.2rem;
        }

        .header {
            display: flex; align-items: center; gap: 0.8rem;
            background: rgba(15, 25, 45, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; padding: 0.8rem 1.2rem;
            border: 1px solid rgba(0, 230, 118, 0.2); flex-wrap: wrap; margin-bottom: 1.5rem;
        }

        .header-logo {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent-green); box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        .header-title {
            font-weight: 700; font-size: 1.3rem; flex: 1;
            background: linear-gradient(135deg, #00e676, #2979ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-user { color: #ccc; font-size: 0.85rem; }
        .hidden { display: none !important; }

        .btn-icon {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 0.5rem 0.9rem; border-radius: 12px; cursor: pointer;
            font-size: 0.85rem; transition: 0.2s; white-space: nowrap;
        }
        .btn-icon:hover { background: rgba(0,230,118,0.15); border-color: var(--accent-green); }
        .btn-danger { background: rgba(255,23,68,0.2); border-color: #ff1744; color: #ff5252; }
        .btn-danger:hover { background: rgba(255,23,68,0.3); }

        .filters {
            display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.5rem; align-items: center;
        }

        .filters input, .filters select {
            padding: 0.6rem 1rem; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
            color: white; font-size: 0.9rem; outline: none; -webkit-appearance: none;
        }
        .filters input:focus, .filters select:focus { border-color: var(--accent-green); }
        .filters select option { background: #1a1a3e; color: white; }

        .games-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem;
        }

        @media (max-width: 768px) { .games-grid { grid-template-columns: 1fr; } }

        .game-card {
            background: rgba(15, 25, 45, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; border: 1px solid rgba(0, 230, 118, 0.1); padding: 1.3rem;
            transition: 0.3s; display: flex; flex-direction: column;
        }
        .game-card:hover { border-color: var(--accent-green); box-shadow: 0 10px 30px rgba(0,230,118,0.15); }

        .game-icon {
            width: 80px; height: 80px; border-radius: 18px; object-fit: cover;
            margin-bottom: 0.8rem; border: 1px solid rgba(255,255,255,0.2);
        }

        .game-title { font-weight: 700; font-size: 1.1rem; color: #69f0ae; margin-bottom: 0.3rem; }
        .game-desc { color: var(--text-secondary); font-size: 0.8rem; flex: 1; margin-bottom: 0.6rem; }

        .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
        .badge {
            background: rgba(41,121,255,0.15); padding: 0.2rem 0.6rem; border-radius: 20px;
            font-size: 0.7rem; color: #90caf9; border: 1px solid rgba(41,121,255,0.3);
        }
        .badge.red { background: rgba(255,23,68,0.15); border-color: rgba(255,23,68,0.3); color: #ff5252; }

        .rating-section {
            margin-bottom: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .stars-container {
            display: flex;
            gap: 0.2rem;
            cursor: pointer;
        }

        .star {
            font-size: 1.5rem;
            color: #555;
            transition: 0.2s;
            user-select: none;
        }

        .star.active {
            color: #ffd740;
        }

        .star:hover {
            transform: scale(1.2);
        }

        .rating-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-play {
            background: linear-gradient(135deg, #00e676, #00c853); border: none;
            color: #0a1a2e; padding: 0.7rem; border-radius: 14px; font-weight: 700;
            cursor: pointer; transition: 0.2s; width: 100%; margin-top: auto;
        }
        .btn-play:hover { box-shadow: 0 8px 20px rgba(0,230,118,0.4); transform: translateY(-2px); }

        /* Увеличенное модальное окно */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; padding: 0.8rem;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: #0a0a1a; border-radius: 20px; width: 100%;
            max-width: 1400px; height: 90vh; position: relative;
            border: 2px solid rgba(0,230,118,0.4); box-shadow: 0 0 50px rgba(0,230,118,0.2);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .modal-header {
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.6);
            border-bottom: 1px solid rgba(0,230,118,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1rem;
            color: #69f0ae;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-close {
            background: #ff1744; border: none; color: white;
            width: 34px; height: 34px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; flex-shrink: 0; margin-left: 0.5rem;
        }
        .modal-close:hover { transform: scale(1.05); background: #ff5252; }

        .modal-iframe {
            width: 100%; flex: 1; border: none; background: #000;
        }

        /* Кнопка полноэкранного режима */
        .fullscreen-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(0,230,118,0.3);
            color: #00e676;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .fullscreen-btn:hover {
            background: rgba(0,230,118,0.2);
            border-color: var(--accent-green);
        }

        @media (max-width: 768px) {
            .modal-content {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }
            .modal {
                padding: 0;
            }
            .modal-title {
                font-size: 0.85rem;
                max-width: 200px;
            }
            .fullscreen-btn span {
                display: none;
            }
        }


        .no-games { text-align: center; color: var(--text-secondary); padding: 3rem; font-size: 1.1rem; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="app">
        <div class="header">
            <img src="https://i.ibb.co/wFK0H7rM/Glo-BIT-Arcade.jpg" alt="Logo" class="header-logo">
            <span class="header-title">GloBIT Arcade</span>
            <span class="header-user" id="userInfo">Загрузка...</span>
            <button class="btn-icon hidden" id="btnAdminLink" onclick="window.location.href='admin.html'">⚙️ Админ-панель</button>
            <button class="btn-icon btn-danger" onclick="logout()">🚪 Выйти</button>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Поиск игры...">
            <select id="genreFilter">
                <option value="">Все жанры</option>
                <option>Экшн</option>
                <option>Гонки</option>
                <option>Головоломки</option>
                <option>Стратегии</option>
                <option>Аркады</option>
            </select>
            <select id="ratingFilter">
                <option value="">Любая оценка</option>
                <option value="4">⭐4+</option>
                <option value="3">⭐3+</option>
                <option value="2">⭐2+</option>
                <option value="1">⭐1+</option>
            </select>
            <select id="ageFilter">
                <option value="">Любой возраст</option>
                <option>3+</option>
                <option>6+</option>
                <option>12+</option>
                <option>16+</option>
                <option>18+</option>
            </select>
        </div>

        <div class="games-grid" id="gamesGrid">
            <div class="no-games">Загрузка игр...</div>
        </div>

        <!-- Увеличенное модальное окно -->
        <div class="modal" id="gameModal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="modal-title" id="modalGameTitle">Игра</span>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
                            🖥️ <span>Полный экран</span>
                        </button>
                        <button class="modal-close" onclick="closeModal()">✕</button>
                    </div>
                </div>
                <iframe class="modal-iframe" id="gameIframe" title="Игра" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen></iframe>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6GGJxAiao77U7_9mBUEjftmS_FnSWbIw",
            authDomain: "glob-data.firebaseapp.com",
            projectId: "glob-data",
            storageBucket: "glob-data.firebasestorage.app",
            messagingSenderId: "122757049174",
            appId: "1:122757049174:web:ebb425edd0e1a8ea9a44f7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        // Сохраняем одну Firebase-сессию между каталогом и играми на этом же сайте.
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        particlesJS('particles-js', {
            particles: {
                number: { value: 50, density: { enable: true, value_area: 800 } },
                color: { value: ['#00e676', '#2979ff', '#ff1744', '#ffffff'] },
                shape: { type: 'circle' },
                opacity: { value: 0.3, random: true },
                size: { value: 2.5, random: true },
                line_linked: { enable: true, distance: 150, color: '#2979ff', opacity: 0.1, width: 1 },
                move: { enable: true, speed: 1.2, direction: 'none', random: true }
            },
            interactivity: { detect_on: 'canvas', events: { onhover: { enable: true, mode: 'grab' } } },
            retina_detect: true
        });

        let currentUser = null;
        let currentRole = 'user';
        let allGames = [];
        let userRatings = {};
        let currentGameName = '';

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;
            try {
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.data() || {};
                currentRole = userData.role || 'user';
                document.getElementById('userInfo').textContent = userData.displayName || user.email?.split('@')[0] || 'Игрок';
                if (currentRole === 'admin' || currentRole === 'employee') {
                    document.getElementById('btnAdminLink').classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('userInfo').textContent = user.email?.split('@')[0] || 'Игрок';
            }
            await loadUserRatings();
            loadGames();
        });

        async function loadUserRatings() {
            if (!currentUser) return;
            try {
                const snap = await db.collection('arcade_games').get();
                await Promise.all(snap.docs.map(async doc => {
                    const ratingRef = db.collection('arcade_games').doc(doc.id).collection('ratings').doc(currentUser.uid);
                    const ratingDoc = await ratingRef.get();
                    if (ratingDoc.exists) userRatings[doc.id] = ratingDoc.data().rating;
                }));
            } catch (e) {
                console.error('Ошибка загрузки оценок пользователя:', e);
            }
        }

        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '<div class="no-games">Загрузка игр...</div>';
            try {
                const snap = await db.collection('arcade_games').get();
                const remoteGames = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(g => g.hidden !== true && (g.url || g.gameUrl || g.link))
                    .map(g => {
                        let url = g.url || g.gameUrl || g.link;
                        // Поддерживаем старые записи каталога после переноса HTML-файлов в /game.
                        const movedPaths = {
                            'mario_run.html': 'game/mario_run.html',
                            'nitro_rush.html': 'game/nitro_rush.html',
                            'run_casino.html': 'game/run_casino.html'
                        };
                        if (movedPaths[url]) url = movedPaths[url];
                        if (typeof url === 'string' && url.startsWith('/') && movedPaths[url.slice(1)]) url = '/' + movedPaths[url.slice(1)];
                        return { ...g, name: g.name || g.title || 'Без названия', url, icon: g.icon || g.image || g.thumbnail || '', genre: g.genre || g.category || 'Аркада', ageRating: g.ageRating || g.age || '3+', description: g.description || g.desc || '' };
                    });
                // Локальная карточка гарантирует доступ к игре даже до добавления записи в Firestore.
                const moscowGame = {
                    id: 'moscowat3am-local',
                    name: 'Москва в 3 часа ночи',
                    url: 'game/moscowat3.00am.html',
                    icon: '🌃',
                    genre: 'Экшн',
                    ageRating: '12+',
                    description: 'Ночная 3D-оборона Москвы: волны целей, улучшения и режим Global ID.',
                    rating: 0,
                    localGame: true
                };
                allGames = [moscowGame, ...remoteGames.filter(g => g.id !== moscowGame.id)];
                if (allGames.length === 0) {
                    grid.innerHTML = '<div class="no-games">Нет доступных игр. Добавьте игры через админ-панель.</div>';
                } else {
                    renderGames();
                }
            } catch (e) {
                console.error('Ошибка загрузки игр:', e);
                grid.innerHTML = `<div class="no-games">Не удалось загрузить игры.<br><small>${escapeHtml(e.code || e.message || 'Проверьте правила Firestore')}</small></div>`;
            }
        }

        function renderGames() {
            const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const genre = document.getElementById('genreFilter')?.value || '';
            const rating = parseInt(document.getElementById('ratingFilter')?.value || '0');
            const age = document.getElementById('ageFilter')?.value || '';

            let filtered = allGames.filter(g => {
                if (search && !(g.name || '').toLowerCase().includes(search)) return false;
                if (genre && g.genre !== genre) return false;
                if (rating && (g.rating || 0) < rating) return false;
                if (age && g.ageRating !== age) return false;
                return true;
            });

            const grid = document.getElementById('gamesGrid');
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-games">Игры не найдены</div>';
                return;
            }

            grid.innerHTML = filtered.map(g => {
                const userRating = userRatings[g.id] || 0;
                const avgRating = g.rating || 0;
                const totalRatings = g.totalRatings || 0;
                
                return `
                <div class="game-card">
                    <img src="${g.icon || 'https://i.ibb.co/wFK0H7rM/Glo-BIT-Arcade.jpg'}" 
                         alt="${g.name}" class="game-icon" 
                         onerror="this.src='https://i.ibb.co/wFK0H7rM/Glo-BIT-Arcade.jpg'">
                    <div class="game-title">${escapeHtml(g.name) || 'Без названия'}</div>
                    <div class="game-desc">${escapeHtml((g.description || '').substring(0, 80))}...</div>
                    <div class="badges">
                        <span class="badge">${escapeHtml(g.genre || 'Аркада')}</span>
                        <span class="badge red">${escapeHtml(g.ageRating || '3+')}</span>
                    </div>
                    <div class="rating-section">
                        <div class="stars-container" id="stars-${g.id}" data-game-id="${g.id}">
                            ${[1,2,3,4,5].map(i => 
                                `<span class="star ${i <= userRating ? 'active' : ''}" 
                                      data-rating="${i}" 
                                      onclick="rateGame('${g.id}', ${i})">★</span>`
                            ).join('')}
                        </div>
                        <div class="rating-info">
                            ⭐ ${avgRating.toFixed(1)} (${totalRatings} оценок)
                            ${userRating > 0 ? ' • Ваша: ' + userRating + '★' : ''}
                        </div>
                    </div>
                    <button class="btn-play" onclick="playGame('${g.id}')">🎮 Играть</button>
                </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        window.rateGame = async function(gameId, rating) {
            if (!currentUser) {
                alert('Необходимо войти в систему');
                return;
            }
            
            try {
                const ratingRef = db.collection('arcade_games').doc(gameId).collection('ratings').doc(currentUser.uid);
                const gameRef = db.collection('arcade_games').doc(gameId);
                
                const oldRatingDoc = await ratingRef.get();
                const oldRating = oldRatingDoc.exists ? oldRatingDoc.data().rating : null;
                
                const batch = db.batch();
                
                batch.set(ratingRef, { 
                    rating: rating, 
                    userId: currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                const gameDoc = await gameRef.get();
                const gameData = gameDoc.data();
                let newTotalRatings = gameData.totalRatings || 0;
                let newRatingSum = (gameData.rating || 0) * newTotalRatings;
                
                if (oldRating) {
                    newRatingSum = newRatingSum - oldRating + rating;
                } else {
                    newTotalRatings++;
                    newRatingSum += rating;
                }
                
                const newAvgRating = newRatingSum / newTotalRatings;
                
                batch.update(gameRef, {
                    rating: Math.round(newAvgRating * 10) / 10,
                    totalRatings: newTotalRatings
                });

                await batch.commit();
                
                userRatings[gameId] = rating;
                const gameIndex = allGames.findIndex(g => g.id === gameId);
                if (gameIndex !== -1) {
                    allGames[gameIndex].rating = Math.round(newAvgRating * 10) / 10;
                    allGames[gameIndex].totalRatings = newTotalRatings;
                }
                
                renderGames();
                
            } catch (e) {
                console.error('Ошибка при оценке игры:', e);
                alert('Ошибка при сохранении оценки');
            }
        };

        window.playGame = function(gameId) {
            const game = allGames.find(g => g.id === gameId);
            if (!game || !game.url) return alert('Ссылка на игру отсутствует');
            
            currentGameName = game.name || 'Игра';
            document.getElementById('modalGameTitle').textContent = currentGameName;
            document.getElementById('gameIframe').src = game.url;
            document.getElementById('gameModal').classList.add('active');
            
            // Блокируем скролл страницы
            document.body.style.overflow = 'hidden';
            
            db.collection('arcade_games').doc(gameId).update({
                plays: firebase.firestore.FieldValue.increment(1)
            }).catch(() => {});
        };

        window.closeModal = function() {
            document.getElementById('gameModal').classList.remove('active');
            document.getElementById('gameIframe').src = '';
            document.body.style.overflow = '';
        };

        window.toggleFullscreen = function() {
            const modalContent = document.querySelector('.modal-content');
            if (!modalContent) return;
            
            if (!document.fullscreenElement) {
                modalContent.requestFullscreen().catch(err => {
                    console.log(`Ошибка перехода в полноэкранный режим: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        };

        // Обработка Esc для закрытия модального окна
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('gameModal').classList.contains('active')) {
                    closeModal();
                }
            }
        });

        document.getElementById('searchInput').addEventListener('input', renderGames);
        document.getElementById('genreFilter').addEventListener('change', renderGames);
        document.getElementById('ratingFilter').addEventListener('change', renderGames);
        document.getElementById('ageFilter').addEventListener('change', renderGames);

        window.logout = async function() {
            if (currentUser) {
                await db.collection('users').doc(currentUser.uid).update({ online: false }).catch(() => {});
                await auth.signOut();
            }
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>

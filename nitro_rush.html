<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D Гонки | Правильное управление</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background: #000;
    }
    
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }
    
    #menuScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0d0d35 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 20px;
      padding: 20px;
    }
    
    #menuScreen.hidden { display: none; }
    
    .menu-title {
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 900;
      color: #ff4444;
      text-shadow: 0 0 30px rgba(255,68,68,0.8), 0 0 60px rgba(255,68,68,0.4);
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .menu-subtitle {
      font-size: clamp(14px, 3vw, 18px);
      color: #aabbcc;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .menu-section {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .section-label {
      color: #8899aa;
      font-size: clamp(12px, 2.5vw, 14px);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-align: center;
    }
    
    .car-selector, .difficulty-selector {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .car-option, .diff-option {
      padding: 12px 16px;
      border-radius: 15px;
      background: rgba(255,255,255,0.08);
      color: #ccc;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      font-weight: 600;
      font-size: clamp(13px, 3vw, 16px);
      border: 2px solid transparent;
      flex: 1;
      min-width: 80px;
    }
    
    .car-option.selected, .diff-option.selected {
      border-color: #ff4444;
      background: rgba(255,68,68,0.2);
      color: #fff;
      box-shadow: 0 0 20px rgba(255,68,68,0.3);
    }
    
    .play-button {
      padding: 18px 50px;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 900;
      background: linear-gradient(135deg, #ff4444, #ff6666);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 10px 30px rgba(255,68,68,0.5);
      transition: all 0.3s;
      text-transform: uppercase;
      margin-top: 10px;
    }
    
    #gameUI {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    
    #gameUI.hidden { display: none; }
    
    #scoreDisplay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.7);
      color: #ffaa00;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: clamp(16px, 4vw, 22px);
      font-weight: bold;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,170,0,0.3);
    }
    
    #speedDisplay {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      color: #88ccff;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: bold;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(136,204,255,0.3);
    }
    
    #boostIndicator {
      position: absolute;
      top: 70px;
      left: 15px;
      background: rgba(0,0,0,0.7);
      color: #ff6600;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: clamp(12px, 3vw, 16px);
      font-weight: bold;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,102,0,0.5);
      transition: all 0.3s;
    }
    
    #boostIndicator.boosting {
      background: rgba(255,102,0,0.8);
      color: #fff;
      animation: pulse 0.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    #mobileControls {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      pointer-events: auto;
      gap: 10px;
    }
    
    .control-btn {
      width: clamp(65px, 16vw, 90px);
      height: clamp(65px, 16vw, 90px);
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      font-size: clamp(24px, 5vw, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    
    .control-btn:active {
      background: rgba(255,255,255,0.3);
      transform: scale(0.9);
    }
    
    #boostBtn {
      background: rgba(255,102,0,0.3);
      border-color: rgba(255,102,0,0.6);
      color: #ff8800;
      font-size: clamp(20px, 4vw, 28px);
    }
    
    #brakeBtn {
      background: rgba(255,0,0,0.2);
      border-color: rgba(255,0,0,0.5);
      color: #ff4444;
      font-size: clamp(20px, 4vw, 28px);
    }
    
    #boostEffect, #brakeEffect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    #boostEffect { background: radial-gradient(ellipse at center, transparent 60%, rgba(255,100,0,0.3) 100%); }
    #boostEffect.active { opacity: 1; }
    
    #brakeEffect { background: radial-gradient(ellipse at center, transparent 60%, rgba(255,0,0,0.2) 100%); }
    #brakeEffect.active { opacity: 1; }
    
    #gameOverScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(10px);
      gap: 15px;
      padding: 20px;
    }
    
    #gameOverScreen.visible { display: flex; }
    
    .gameover-title {
      font-size: clamp(36px, 10vw, 56px);
      font-weight: 900;
      color: #ff4444;
      text-shadow: 0 0 30px rgba(255,68,68,0.8);
    }
    
    .gameover-score {
      font-size: clamp(20px, 5vw, 28px);
      color: #ffaa00;
      margin: 10px 0;
    }
    
    .restart-btn, .menu-btn {
      padding: 15px 30px;
      font-size: clamp(16px, 4vw, 22px);
      font-weight: bold;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .restart-btn {
      background: #ff4444;
      color: white;
    }
    
    .menu-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
    }
    
    .desktop-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 8px 20px;
      border-radius: 20px;
      pointer-events: none;
      white-space: nowrap;
    }
    
    @media (min-width: 1024px) {
      #mobileControls { display: none; }
    }
  </style>
</head>
<body>
  <div id="menuScreen">
    <div class="menu-title">🏎️ ГОНКИ 3D</div>
    <div class="menu-subtitle">Бесконечное шоссе</div>
    
    <div class="menu-section">
      <div class="section-label">🚗 Выберите автомобиль</div>
      <div class="car-selector" id="carSelector">
        <div class="car-option selected" data-car="0">
          <div>🔴</div><div>Красный</div>
        </div>
        <div class="car-option" data-car="1">
          <div>🔵</div><div>Синий</div>
        </div>
        <div class="car-option" data-car="2">
          <div>🟡</div><div>Жёлтый</div>
        </div>
      </div>
    </div>
    
    <div class="menu-section">
      <div class="section-label">⚡ Сложность</div>
      <div class="difficulty-selector" id="difficultySelector">
        <div class="diff-option" data-diff="0">Лёгкая</div>
        <div class="diff-option selected" data-diff="1">Средняя</div>
        <div class="diff-option" data-diff="2">Сложная</div>
      </div>
    </div>
    
    <button class="play-button" id="playButton">▶ ИГРАТЬ</button>
  </div>
  
  <div id="gameUI" class="hidden">
    <div id="scoreDisplay">🏆 0</div>
    <div id="speedDisplay">⚡ 80 км/ч</div>
    <div id="boostIndicator">🔥 Буст: 0</div>
    
    <div id="mobileControls">
      <button class="control-btn" id="leftBtn">◀</button>
      <button class="control-btn" id="brakeBtn">⏬</button>
      <button class="control-btn" id="boostBtn">⚡</button>
      <button class="control-btn" id="rightBtn">▶</button>
    </div>
    
    <div class="desktop-hint" id="desktopHint">
      ← → / A D — движение | ПРОБЕЛ — буст (50 очков) | ↓ / S — тормоз
    </div>
  </div>
  
  <div id="boostEffect"></div>
  <div id="brakeEffect"></div>
  
  <div id="gameOverScreen">
    <div class="gameover-title">АВАРИЯ!</div>
    <div class="gameover-score">Очки: <span id="finalScore">0</span></div>
    <button class="restart-btn" id="restartFromOver">🔄 Заново</button>
    <button class="menu-btn" id="menuFromOver">🏠 В меню</button>
  </div>
  
  <canvas id="gameCanvas"></canvas>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    
    const canvas = document.getElementById('gameCanvas');
    const LANE_WIDTH = 2.8;
    const LANE_COUNT = 3;
    const ROAD_WIDTH = LANE_WIDTH * LANE_COUNT;
    const ROAD_SEGMENT_LENGTH = 20;
    const BOOST_COST = 50;
    const BOOST_SPEED_MULTIPLIER = 2.0;
    const BRAKE_SPEED_MULTIPLIER = 0.4;
    
    const CAR_COLORS = [0xff3333, 0x3366ff, 0xffdd00];
    const DIFFICULTY_SETTINGS = [
      { baseSpeed: 0.28, enemySpeed: 0.2, spawnRate: 55 },
      { baseSpeed: 0.35, enemySpeed: 0.28, spawnRate: 45 },
      { baseSpeed: 0.42, enemySpeed: 0.35, spawnRate: 35 }
    ];
    
    let selectedCar = 0;
    let selectedDifficulty = 1;
    let difficulty = DIFFICULTY_SETTINGS[1];
    
    const state = {
      gameActive: false, score: 0, speed: 0.35, baseSpeed: 0.35,
      playerLane: 1, enemies: [], coins: [], playerCar: null,
      isBoosting: false, isBraking: false, boostParticles: []
    };
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);
    scene.fog = new THREE.Fog(0x111122, 40, 120);
    
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 150);
    
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    scene.add(new THREE.AmbientLight(0x606080));
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(15, 25, 20);
    dirLight.castShadow = true;
    dirLight.receiveShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 100;
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -20;
    scene.add(dirLight);
    
    const fillLight = new THREE.DirectionalLight(0x8899cc, 0.5);
    fillLight.position.set(-5, 10, -5);
    scene.add(fillLight);
    
    const roadSegments = [];
    
    function createRoadSegment(zPos) {
      const segment = new THREE.Group();
      const road = new THREE.Mesh(
        new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_SEGMENT_LENGTH),
        new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.7, metalness: 0.3 })
      );
      road.rotation.x = -Math.PI / 2;
      road.position.z = ROAD_SEGMENT_LENGTH / 2;
      road.receiveShadow = true;
      segment.add(road);
      
      const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: new THREE.Color(0x333300) });
      for (let i = -1; i <= 1; i++) {
        if (i === 0) continue;
        for (let j = 0; j < ROAD_SEGMENT_LENGTH; j += 5) {
          const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 3), lineMat);
          line.rotation.x = -Math.PI / 2;
          line.position.set(i * LANE_WIDTH, 0.03, j + 1.5);
          line.receiveShadow = true;
          segment.add(line);
        }
      }
      
      const centerMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: new THREE.Color(0x442200) });
      for (let offset of [-0.2, 0.2]) {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, ROAD_SEGMENT_LENGTH), centerMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(offset, 0.04, ROAD_SEGMENT_LENGTH / 2);
        line.receiveShadow = true;
        segment.add(line);
      }
      
      segment.position.z = zPos;
      return segment;
    }
    
    function initRoadPool() {
      roadSegments.forEach(seg => scene.remove(seg));
      roadSegments.length = 0;
      for (let i = -1; i < 9; i++) {
        const segment = createRoadSegment(i * ROAD_SEGMENT_LENGTH);
        scene.add(segment);
        roadSegments.push(segment);
      }
    }
    
    function updateRoadPool() {
      roadSegments.forEach(segment => {
        if (segment.position.z < -ROAD_SEGMENT_LENGTH * 2) {
          let maxZ = -Infinity;
          roadSegments.forEach(s => { if (s.position.z > maxZ) maxZ = s.position.z; });
          segment.position.z = maxZ + ROAD_SEGMENT_LENGTH;
        }
      });
    }
    
    const shoulderGeo = new THREE.PlaneGeometry(10, 300);
    const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 });
    const leftShoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
    leftShoulder.rotation.x = -Math.PI / 2;
    leftShoulder.position.set(-ROAD_WIDTH/2 - 4.5, -0.2, 120);
    leftShoulder.receiveShadow = true;
    scene.add(leftShoulder);
    
    const rightShoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
    rightShoulder.rotation.x = -Math.PI / 2;
    rightShoulder.position.set(ROAD_WIDTH/2 + 4.5, -0.2, 120);
    rightShoulder.receiveShadow = true;
    scene.add(rightShoulder);
    
    const trees = [];
    function addTree(x, z) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.4, 3),
        new THREE.MeshStandardMaterial({ color: 0x6b4c3b })
      );
      trunk.position.y = 1.5;
      trunk.castShadow = trunk.receiveShadow = true;
      tree.add(trunk);
      
      for (let i = 0; i < 3; i++) {
        const foliage = new THREE.Mesh(
          new THREE.ConeGeometry(1.2, 2.5, 8),
          new THREE.MeshStandardMaterial({ color: 0x2d6b27 })
        );
        foliage.position.y = 3 + i * 1.5;
        foliage.scale.set(1 - i * 0.3, 1 - i * 0.3, 1 - i * 0.3);
        foliage.castShadow = foliage.receiveShadow = true;
        tree.add(foliage);
      }
      tree.position.set(x, 0, z);
      scene.add(tree);
      return tree;
    }
    
    for (let z = -20; z < 250; z += 18) {
      trees.push(addTree(-ROAD_WIDTH/2 - 5, z + Math.random() * 4));
      trees.push(addTree(ROAD_WIDTH/2 + 5, z + Math.random() * 4));
    }
    
    function createPlayerCar(colorIndex) {
      const car = new THREE.Group();
      const color = CAR_COLORS[colorIndex];
      
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.0, 0.5, 2.2),
        new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.8, emissive: new THREE.Color(color).multiplyScalar(0.1) })
      );
      body.position.y = 0.4;
      body.castShadow = body.receiveShadow = true;
      car.add(body);
      
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 0.35, 1.0),
        new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1, metalness: 0.5 })
      );
      cabin.position.set(0, 0.8, -0.2);
      cabin.castShadow = cabin.receiveShadow = true;
      car.add(cabin);
      
      const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: new THREE.Color(0xffffcc), emissiveIntensity: 0.5 });
      const hlGeo = new THREE.SphereGeometry(0.15, 8, 8);
      [-0.45, 0.45].forEach(x => {
        const hl = new THREE.Mesh(hlGeo, hlMat);
        hl.position.set(x, 0.4, 1.0);
        car.add(hl);
      });
      
      const rlMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: new THREE.Color(0xff0000), emissiveIntensity: 0.5 });
      const rlGeo = new THREE.SphereGeometry(0.12, 8, 8);
      [-0.45, 0.45].forEach(x => {
        const rl = new THREE.Mesh(rlGeo, rlMat);
        rl.position.set(x, 0.4, -1.05);
        car.add(rl);
      });
      
      const spoiler = new THREE.Mesh(
        new THREE.BoxGeometry(1.1, 0.1, 0.3),
        new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.5 })
      );
      spoiler.position.set(0, 0.75, -0.9);
      spoiler.castShadow = true;
      car.add(spoiler);
      
      [[0.6, 0.8], [-0.6, 0.8], [0.6, -0.8], [-0.6, -0.8]].forEach(([x, z]) => {
        const wheel = new THREE.Group();
        const tire = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.3, 0.3, 16),
          new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
        );
        tire.rotation.z = Math.PI/2;
        tire.castShadow = tire.receiveShadow = true;
        wheel.add(tire);
        
        const rim = new THREE.Mesh(
          new THREE.CylinderGeometry(0.2, 0.2, 0.31, 8),
          new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3, metalness: 0.9 })
        );
        rim.rotation.z = Math.PI/2;
        rim.castShadow = rim.receiveShadow = true;
        wheel.add(rim);
        
        wheel.position.set(x, 0.3, z);
        car.add(wheel);
      });
      
      return car;
    }
    
    function createEnemyCar() {
      const enemy = new THREE.Group();
      const colors = [0x3366cc, 0x33aa33, 0xcc6633, 0x8833aa, 0xdddd44];
      const eColor = colors[Math.floor(Math.random() * colors.length)];
      
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.45, 2.0),
        new THREE.MeshStandardMaterial({ color: eColor, roughness: 0.3, metalness: 0.6 })
      );
      body.position.y = 0.35;
      body.castShadow = body.receiveShadow = true;
      enemy.add(body);
      
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 0.3, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.2 })
      );
      cabin.position.set(0, 0.7, -0.15);
      cabin.castShadow = cabin.receiveShadow = true;
      enemy.add(cabin);
      
      const wGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.25, 8);
      const wMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
      [[0.55, 0.7], [-0.55, 0.7], [0.55, -0.7], [-0.55, -0.7]].forEach(([x, z]) => {
        const wheel = new THREE.Mesh(wGeo, wMat);
        wheel.rotation.z = Math.PI/2;
        wheel.position.set(x, 0.26, z);
        wheel.castShadow = wheel.receiveShadow = true;
        enemy.add(wheel);
      });
      
      return enemy;
    }
    
    function createCoin() {
      const group = new THREE.Group();
      const coin = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.5, 0.15, 16),
        new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.1, metalness: 1.0, emissive: new THREE.Color(0xff8800), emissiveIntensity: 0.4 })
      );
      coin.rotation.x = Math.PI/2;
      coin.castShadow = coin.receiveShadow = true;
      group.add(coin);
      
      const glow = new THREE.Mesh(
        new THREE.CylinderGeometry(0.55, 0.55, 0.17, 16),
        new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.4 })
      );
      glow.rotation.x = Math.PI/2;
      group.add(glow);
      group.position.y = 0.8;
      return group;
    }
    
    function createBoostParticle() {
      const particle = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 })
      );
      particle.position.copy(state.playerCar.position);
      particle.position.z -= 1.5;
      particle.position.y += 0.3;
      particle.position.x += (Math.random() - 0.5) * 0.5;
      particle.userData = {
        life: 1.0,
        velocity: new THREE.Vector3((Math.random() - 0.5) * 0.1, Math.random() * 0.1 + 0.05, -Math.random() * 0.3 - 0.3)
      };
      scene.add(particle);
      state.boostParticles.push(particle);
    }
    
    // ВАЖНО: полоса 0 = ЛЕВАЯ (отрицательный X), полоса 1 = ЦЕНТР, полоса 2 = ПРАВАЯ (положительный X)
    function getLaneX(laneIndex) {
      return (laneIndex - 1) * LANE_WIDTH;
    }
    
    function spawnEnemy() {
      if (!state.gameActive) return;
      const lane = Math.floor(Math.random() * LANE_COUNT);
      const enemy = createEnemyCar();
      enemy.position.set(getLaneX(lane), 0.15, 50);
      scene.add(enemy);
      state.enemies.push({ mesh: enemy, lane, speed: difficulty.enemySpeed + Math.random() * 0.1 });
    }
    
    function spawnCoin() {
      if (!state.gameActive) return;
      const lane = Math.floor(Math.random() * LANE_COUNT);
      const coin = createCoin();
      coin.position.set(getLaneX(lane), 0.0, 45);
      scene.add(coin);
      state.coins.push({ mesh: coin, lane, speed: 0.25 });
    }
    
    function movePlayer(direction) {
      if (!state.gameActive) return;
      if (direction === 'left' && state.playerLane > 0) {
        state.playerLane--;
      } else if (direction === 'right' && state.playerLane < LANE_COUNT - 1) {
        state.playerLane++;
      }
    }
    
    function activateBoost() {
      if (!state.gameActive || state.isBoosting || state.score < BOOST_COST) return;
      state.score -= BOOST_COST;
      state.isBoosting = true;
      state.speed = state.baseSpeed * BOOST_SPEED_MULTIPLIER;
      document.getElementById('boostEffect').classList.add('active');
      document.getElementById('boostIndicator').classList.add('boosting');
      setTimeout(() => {
        state.isBoosting = false;
        state.speed = state.baseSpeed;
        document.getElementById('boostEffect').classList.remove('active');
        document.getElementById('boostIndicator').classList.remove('boosting');
      }, 2000);
      updateUI();
    }
    
    function activateBrake() {
      if (!state.gameActive || state.isBraking || state.isBoosting) return;
      state.isBraking = true;
      state.speed = state.baseSpeed * BRAKE_SPEED_MULTIPLIER;
      document.getElementById('brakeEffect').classList.add('active');
    }
    
    function deactivateBrake() {
      if (!state.isBraking) return;
      state.isBraking = false;
      state.speed = state.baseSpeed;
      document.getElementById('brakeEffect').classList.remove('active');
    }
    
    function startGame() {
      state.enemies.forEach(e => scene.remove(e.mesh));
      state.enemies = [];
      state.coins.forEach(c => scene.remove(c.mesh));
      state.coins = [];
      state.boostParticles.forEach(p => scene.remove(p));
      state.boostParticles = [];
      if (state.playerCar) scene.remove(state.playerCar);
      
      difficulty = DIFFICULTY_SETTINGS[selectedDifficulty];
      initRoadPool();
      
      state.playerCar = createPlayerCar(selectedCar);
      state.playerCar.position.set(0, 0.2, 0);
      state.playerCar.castShadow = state.playerCar.receiveShadow = true;
      scene.add(state.playerCar);
      
      state.gameActive = true;
      state.score = 0;
      state.baseSpeed = difficulty.baseSpeed;
      state.speed = difficulty.baseSpeed;
      state.playerLane = 1;
      state.isBoosting = false;
      state.isBraking = false;
      
      document.getElementById('menuScreen').classList.add('hidden');
      document.getElementById('gameUI').classList.remove('hidden');
      document.getElementById('gameOverScreen').classList.remove('visible');
      document.getElementById('boostEffect').classList.remove('active');
      document.getElementById('brakeEffect').classList.remove('active');
      document.getElementById('boostIndicator').classList.remove('boosting');
      
      updateUI();
      
      const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
      document.getElementById('desktopHint').style.display = isMobile ? 'none' : 'block';
      document.getElementById('mobileControls').style.display = isMobile ? 'flex' : 'none';
    }
    
    function gameOver() {
      if (!state.gameActive) return;
      state.gameActive = false;
      document.getElementById('boostEffect').classList.remove('active');
      document.getElementById('brakeEffect').classList.remove('active');
      document.getElementById('finalScore').textContent = state.score;
      document.getElementById('gameOverScreen').classList.add('visible');
    }
    
    function returnToMenu() {
      state.gameActive = false;
      state.enemies.forEach(e => scene.remove(e.mesh));
      state.enemies = [];
      state.coins.forEach(c => scene.remove(c.mesh));
      state.coins = [];
      state.boostParticles.forEach(p => scene.remove(p));
      state.boostParticles = [];
      if (state.playerCar) { scene.remove(state.playerCar); state.playerCar = null; }
      roadSegments.forEach(seg => scene.remove(seg));
      roadSegments.length = 0;
      
      document.getElementById('menuScreen').classList.remove('hidden');
      document.getElementById('gameUI').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.remove('visible');
      document.getElementById('boostEffect').classList.remove('active');
      document.getElementById('brakeEffect').classList.remove('active');
    }
    
    function updateUI() {
      document.getElementById('scoreDisplay').textContent = `🏆 ${state.score}`;
      const speedKmh = Math.floor(80 + state.speed * 150);
      document.getElementById('speedDisplay').textContent = `⚡ ${speedKmh} км/ч`;
      
      if (state.isBoosting) {
        document.getElementById('boostIndicator').textContent = '🔥 БУСТ АКТИВЕН!';
      } else if (state.isBraking) {
        document.getElementById('boostIndicator').textContent = '⏬ ТОРМОЖЕНИЕ';
      } else {
        document.getElementById('boostIndicator').textContent = `🔥 Буст: ${state.score} (${BOOST_COST} для активации)`;
      }
    }
    
    // ---------- ОБРАБОТЧИКИ ----------
    document.querySelectorAll('#carSelector .car-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('#carSelector .car-option').forEach(o => o.classList.remove('selected'));
        option.classList.add('selected');
        selectedCar = parseInt(option.dataset.car);
      });
    });
    
    document.querySelectorAll('#difficultySelector .diff-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('#difficultySelector .diff-option').forEach(o => o.classList.remove('selected'));
        option.classList.add('selected');
        selectedDifficulty = parseInt(option.dataset.diff);
      });
    });
    
    document.getElementById('playButton').addEventListener('click', startGame);
    document.getElementById('restartFromOver').addEventListener('click', startGame);
    document.getElementById('menuFromOver').addEventListener('click', returnToMenu);
    
    // КЛАВИАТУРА
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        movePlayer('left');
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        movePlayer('right');
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        e.preventDefault();
        activateBrake();
      } else if (e.key === ' ') {
        e.preventDefault();
        activateBoost();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        if (state.gameActive) startGame();
      } else if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        returnToMenu();
      }
    });
    
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        deactivateBrake();
      }
    });
    
    // МОБИЛЬНЫЕ КНОПКИ — теперь направления правильные!
    document.getElementById('leftBtn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      movePlayer('left');
    });
    
    document.getElementById('rightBtn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      movePlayer('right');
    });
    
    document.getElementById('boostBtn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activateBoost();
    });
    
    document.getElementById('brakeBtn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activateBrake();
    });
    
    document.getElementById('brakeBtn').addEventListener('pointerup', () => deactivateBrake());
    document.getElementById('brakeBtn').addEventListener('pointerleave', () => deactivateBrake());
    
    // СВАЙПЫ — исправлено!
    let touchStartX = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    
    window.addEventListener('touchend', (e) => {
      if (!state.gameActive) return;
      const diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) > 40) {
        if (diff < 0) {
          // Свайп влево — едем влево
          movePlayer('left');
        } else {
          // Свайп вправо — едем вправо
          movePlayer('right');
        }
      }
    });
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
      document.getElementById('desktopHint').style.display = isMobile ? 'none' : 'block';
      document.getElementById('mobileControls').style.display = isMobile ? 'flex' : 'none';
    });
    
    const isMobileDevice = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
    document.getElementById('desktopHint').style.display = isMobileDevice ? 'none' : 'block';
    document.getElementById('mobileControls').style.display = isMobileDevice ? 'flex' : 'none';
    
    // ---------- ИГРОВОЙ ЦИКЛ ----------
    let spawnEnemyCounter = 0;
    let spawnCoinCounter = 0;
    let boostParticleTimer = 0;
    
    function animate() {
      requestAnimationFrame(animate);
      
      if (state.gameActive && state.playerCar) {
        const targetX = getLaneX(state.playerLane);
        state.playerCar.position.x += (targetX - state.playerCar.position.x) * 0.15;
        
        if (!state.isBoosting && !state.isBraking) {
          state.speed = state.baseSpeed;
        }
        
        const currentSpeed = state.speed;
        
        for (let i = state.enemies.length - 1; i >= 0; i--) {
          const enemy = state.enemies[i];
          enemy.mesh.position.z -= currentSpeed * 1.3;
          
          if (Math.abs(enemy.mesh.position.z - state.playerCar.position.z) < 2.0 &&
              Math.abs(enemy.mesh.position.x - state.playerCar.position.x) < 1.2) {
            gameOver();
          }
          
          if (enemy.mesh.position.z < -15) {
            scene.remove(enemy.mesh);
            state.enemies.splice(i, 1);
            state.score += 10;
            updateUI();
          }
        }
        
        for (let i = state.coins.length - 1; i >= 0; i--) {
          const coin = state.coins[i];
          coin.mesh.position.z -= currentSpeed * 1.3;
          coin.mesh.rotation.y += 0.15;
          
          if (Math.abs(coin.mesh.position.z - state.playerCar.position.z) < 1.8 &&
              Math.abs(coin.mesh.position.x - state.playerCar.position.x) < 1.3) {
            scene.remove(coin.mesh);
            state.coins.splice(i, 1);
            state.score += 25;
            updateUI();
            continue;
          }
          
          if (coin.mesh.position.z < -10) {
            scene.remove(coin.mesh);
            state.coins.splice(i, 1);
          }
        }
        
        if (state.isBoosting) {
          boostParticleTimer++;
          if (boostParticleTimer > 2) {
            boostParticleTimer = 0;
            createBoostParticle();
            createBoostParticle();
          }
        }
        
        for (let i = state.boostParticles.length - 1; i >= 0; i--) {
          const particle = state.boostParticles[i];
          particle.userData.life -= 0.03;
          particle.material.opacity = particle.userData.life;
          particle.position.add(particle.userData.velocity);
          if (particle.userData.life <= 0) {
            scene.remove(particle);
            state.boostParticles.splice(i, 1);
          }
        }
        
        spawnEnemyCounter++;
        if (spawnEnemyCounter > difficulty.spawnRate) {
          spawnEnemy();
          spawnEnemyCounter = 0;
        }
        
        spawnCoinCounter++;
        if (spawnCoinCounter > 65) {
          spawnCoin();
          spawnCoinCounter = 0;
        }
        
        roadSegments.forEach(segment => { segment.position.z -= currentSpeed; });
        updateRoadPool();
        
        leftShoulder.position.z -= currentSpeed;
        rightShoulder.position.z -= currentSpeed;
        if (leftShoulder.position.z < -50) {
          leftShoulder.position.z += 250;
          rightShoulder.position.z += 250;
        }
        
        trees.forEach(tree => {
          tree.position.z -= currentSpeed;
          if (tree.position.z < -30) tree.position.z += 280;
        });
        
        if (state.baseSpeed < 0.85) state.baseSpeed += 0.00015;
        
        updateUI();
      }
      
      if (state.playerCar) {
        const isMobile = window.innerWidth < 768;
        const camX = state.playerCar.position.x * 0.3;
        const camY = isMobile ? 10 : 8;
        const camZ = state.playerCar.position.z - 8;
        
        camera.position.x += (camX - camera.position.x) * 0.08;
        camera.position.y += (camY - camera.position.y) * 0.08;
        camera.position.z += (camZ - camera.position.z) * 0.08;
        
        camera.lookAt(state.playerCar.position.x * 0.8, 1.5, state.playerCar.position.z + 15);
      }
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    console.log('✅ Управление исправлено:');
    console.log('   ◀ ВЛЕВО — едет в левую полосу');
    console.log('   ▶ ВПРАВО — едет в правую полосу');
    console.log('   Свайп влево — в левую полосу');
    console.log('   Свайп вправо — в правую полосу');
    console.log('   ⚡ Буст (50 очков) | ⏬ Тормоз');
  </script>
</body>
</html>
